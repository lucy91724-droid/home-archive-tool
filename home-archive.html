<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>html,body{margin:0;height:100%}body{font-family:system-ui,sans-serif}[hidden]{display:none!important}</style></head><body>
<title>Home Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&family=Courier+Prime&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500&family=Silkscreen&display=swap" rel="stylesheet">
<style>
/* Layout: ruled archive ledger — header strip, index column, open field with crop marks, record card column */
:root{
  color-scheme:light;
  --paper:#E8E8E4; --card:#F4F4F1; --ink:#141414; --mute:#7A7A74; --rule2:rgba(20,20,20,.13);
  --acc:#7D8DE4; --acc-soft:rgba(125,141,228,.14); --glass:rgba(244,244,241,.88); --room:#F7F6F3;
  --mono:"IBM Plex Mono","DejaVu Sans Mono",ui-monospace,monospace;
  --tw:"Courier Prime","Noto Serif TC","Songti TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --px:"Silkscreen","IBM Plex Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;font-weight:400;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.mono{font-family:var(--mono)}
.tw{font-family:var(--tw)}
.px{font-family:var(--px)}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.k small{display:block;font-family:var(--sans);font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--mute);margin-top:2px}
#gdefs{position:absolute;width:0;height:0;overflow:hidden}

/* header */
.bar{height:52px;display:grid;grid-template-columns:272px 1fr auto;border-bottom:1px solid var(--ink);background:var(--card)}
.brand{display:flex;align-items:center;gap:10px;padding:0 18px;border-right:1px solid var(--ink)}
.brand b{font-family:var(--px);font-size:15px;font-weight:400;letter-spacing:.04em}
.brand span{font-size:11.5px;color:var(--mute)}
.steps{display:flex;overflow-x:auto}
.stp{display:flex;align-items:center;gap:8px;padding:0 18px;border-right:1px solid var(--rule2);color:var(--mute);white-space:nowrap;font-size:13.5px}
.stp .n{font-family:var(--px);font-size:12px}
.stp.on{color:var(--ink);background:var(--paper);box-shadow:inset 0 -3px 0 var(--ink)}
.stp.done{color:var(--ink)}
.stp.done .n::after{content:" ✓";font-family:var(--mono)}
.inv{display:flex;align-items:center;padding:0 18px;border-left:1px solid var(--ink);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--mute);white-space:nowrap}

.wrap{position:relative;height:calc(100% - 52px)}
.left,.right{position:absolute;top:12px;bottom:12px;z-index:7;overflow:auto;min-width:0;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.1);backdrop-filter:blur(18px) saturate(1.1);border:1px solid var(--ink)}
.left{left:12px;width:248px}
.right{right:12px;width:340px;display:flex;flex-direction:column}
.center{position:absolute;inset:0;overflow:hidden;background:var(--room)}

/* stage chrome */
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;cursor:grab}
#stage.dragging{cursor:grabbing}
.crop{position:absolute;width:26px;height:26px;border:0 solid var(--ink);pointer-events:none;z-index:3}
.crop.tl{left:14px;top:14px;border-left-width:3px;border-top-width:3px}
.crop.tr{right:14px;top:14px;border-right-width:3px;border-top-width:3px}
.crop.bl{left:14px;bottom:14px;border-left-width:3px;border-bottom-width:3px}
.crop.br{right:14px;bottom:14px;border-right-width:3px;border-bottom-width:3px}
.hud{position:absolute;z-index:3;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);pointer-events:none}
.hud .pxn{font-family:var(--px);font-size:22px;color:var(--acc);letter-spacing:0;vertical-align:-3px}
.zoom{position:absolute;z-index:4;left:276px;bottom:24px;display:flex;border:1px solid var(--ink);background:var(--card)}
.zoom button{width:34px;height:30px;font-family:var(--mono);font-size:13px;border-right:1px solid var(--ink)}
.zoom button:last-child{border-right:0;width:auto;padding:0 10px;font-size:10.5px;letter-spacing:.06em}
.zoom button:hover{background:#fff}
.viewtog{position:absolute;z-index:6;left:calc(260px + (100% - 612px)/2);top:18px;transform:translateX(-50%);display:flex;border:1px solid var(--ink);background:var(--card)}
.viewtog button{padding:7px 16px;font-size:12.5px;border-right:1px solid var(--ink)}
.viewtog button:last-child{border-right:0}
.viewtog button.on{background:var(--ink);color:#fff}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;padding:8px 14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}

/* left: library */
.sec{padding:16px 18px;border-bottom:1px solid var(--ink)}
.sec:last-child{border-bottom:0}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--ink)}
.tab{padding:10px 0 8px;font-size:12.5px;border-right:1px solid var(--rule2);display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute)}
.tab:last-child{border-right:0}
.tab .k{font-size:9px;color:inherit}
.tab.on{color:var(--ink);background:var(--paper);box-shadow:inset 0 -3px 0 var(--ink)}
.note{font-size:12.5px;line-height:1.7;color:#4a4a46}
.sw-grid{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--ink);border-left:1px solid var(--ink);margin-top:12px}
.sw{aspect-ratio:1;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);position:relative;max-width:100%}
.sw:hover::after,.sw.on::after{content:"";position:absolute;inset:4px;border:1.5px solid var(--ink);background:none}
.sw.custom{background:conic-gradient(from 90deg,#d66,#dc6,#6b6,#6bd,#66d,#c6d,#d66)}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.modes{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);margin-top:12px}
.mode{padding:8px 4px;font-size:12px;border-right:1px solid var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.mode:last-child{border-right:0}
.mode .k{font-size:8.5px;color:var(--mute)}
.mode.on{background:var(--ink);color:#fff}
.mode.on .k{color:#bbb}
.selnote{margin-top:12px;border:1px dashed var(--acc);background:var(--acc-soft);padding:8px 10px;font-size:12px;line-height:1.6;display:flex;justify-content:space-between;gap:8px;align-items:center}
.selnote button{font-family:var(--mono);font-size:10.5px;text-decoration:underline}
.cells{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--ink);border-left:1px solid var(--ink);margin-top:12px}
.cells.c3{grid-template-columns:repeat(3,1fr)}
.cell{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);display:flex;flex-direction:column;align-items:stretch;background:rgba(251,251,249,.7);text-align:left}
.cell:hover{background:#fff}
.cell svg{display:block;width:100%;height:auto;aspect-ratio:1/1}
.cell .cap{display:flex;justify-content:space-between;align-items:baseline;padding:5px 7px 6px;gap:4px;border-top:1px solid var(--rule2)}
.cell .cap span:first-child{font-size:12.5px;font-weight:500}
.cell .cap .k{font-size:8.5px;color:var(--mute)}
.pal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 10px;margin-top:14px}
.pc{display:flex;flex-direction:column;gap:5px;align-items:stretch;text-align:left}
.pc .swc{display:block;aspect-ratio:1/1.18;max-width:100%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .15s}
.pc:hover .swc{transform:translateY(-2px)}
.pc.on .swc{outline:1.5px solid var(--ink);outline-offset:2px}
.pc .code{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--mute)}
.custom-row{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:12px;margin-top:16px;padding-top:12px;border-top:1px solid var(--rule2);font-size:12.5px}
.custom-row label{position:relative;aspect-ratio:1/1;background:conic-gradient(from 90deg,#d66,#dc6,#6b6,#6bd,#66d,#c6d,#d66);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.custom-row input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.mlist{display:flex;flex-direction:column;margin-top:12px;border-top:1px solid var(--ink)}
.mrow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule2);text-align:left;width:100%}
.mrow:hover{background:rgba(255,255,255,.55)}
.mrow svg{width:52px;height:52px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.mrow .nm{font-size:13.5px;line-height:1.3}
.mrow .nm small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--mute);margin-top:3px}
.mrow .code{font-family:var(--mono);font-size:9.5px;color:var(--mute);padding-right:4px}
.mrow .tag{font-family:var(--mono);font-size:9px;letter-spacing:.06em;border:1px solid var(--ink);padding:2px 5px}
.hint2{font-size:11.5px;line-height:1.6;color:var(--mute);margin-top:6px}
.ocat{margin-top:16px}
.ocat .cells{margin-top:8px}
.addbtn{width:100%;margin-top:12px;border:1px solid var(--ink);padding:12px;display:flex;justify-content:space-between;align-items:center;font-size:13px;background:#fff}
.addbtn:hover{background:var(--ink);color:#fff}
.idx{display:flex;flex-direction:column}
.ir{display:grid;grid-template-columns:44px 40px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule2);font-size:12.5px;cursor:pointer;text-align:left;width:100%}
.ir:hover{background:#fff}
.ir.on{background:var(--acc-soft);box-shadow:inset 3px 0 0 var(--acc)}
.ir .no{font-family:var(--mono);font-size:10.5px;color:var(--mute);padding-left:6px}
.ir .th{width:40px;height:40px}
.ir .th svg{width:40px;height:40px;display:block}
.ir .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ir .st{font-family:var(--mono);font-size:10px;letter-spacing:.05em;padding-right:6px;color:var(--mute)}
.ir .st.ok{color:var(--ink)}
.ir .del{font-family:var(--mono);font-size:12px;color:var(--mute);padding:0 8px}
.ir .del:hover{color:var(--ink)}

/* right: record card */
.rbody{padding:20px 20px 16px;display:flex;flex-direction:column;gap:16px;flex:1}
.rh{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:end}
.rh .big{font-family:var(--px);font-size:46px;line-height:.8;color:var(--acc)}
.rh h2{font-size:19px;font-weight:500;line-height:1.35;margin-top:4px;text-wrap:balance}
.lede{font-size:13.5px;line-height:1.8;color:#3c3c39}
.hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--mute);line-height:1.6}
.rec{border:1px solid var(--ink);background:rgba(251,251,249,.82)}
.rec .r{display:grid;grid-template-columns:86px minmax(0,1fr);border-top:1px solid var(--ink)}
.rec .r:first-child{border-top:0}
.rec .r>.k{padding:10px 10px;border-right:1px solid var(--ink)}
.rec .r>.v{padding:9px 12px;min-width:0;font-size:13.5px;line-height:1.6;display:flex;flex-direction:column;gap:6px;justify-content:center}
.rec .top{display:grid;grid-template-columns:minmax(0,1fr) 96px;border-bottom:1px solid var(--ink)}
.rec .top .meta .r:first-child{border-top:0}
.rec .top .meta{border-right:1px solid var(--ink)}
.rec .top .typ{display:flex;flex-direction:column;justify-content:space-between;padding:6px}
.rec .top .typ .k{font-size:9px;display:flex;justify-content:space-between}
.rec .top .typ svg{width:100%;height:auto;aspect-ratio:1/1;display:block;flex:none}
.v .q{font-size:13px;color:#2c2c2a}
textarea.lined{width:100%;border:0;background:transparent;resize:vertical;font-family:var(--tw);font-size:15px;line-height:28px;min-height:84px;padding:0 2px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--rule2) 27px,var(--rule2) 28px);background-attachment:local}
textarea.lined:focus{outline:0;background-color:var(--acc-soft)}
input.line{width:100%;border:0;border-bottom:1px solid var(--rule2);background:transparent;padding:4px 2px;font-family:var(--tw);font-size:15px}
input.line:focus{outline:0;border-bottom-color:var(--acc);background:var(--acc-soft)}
.opts{display:flex;flex-direction:column}
.opt{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--rule2);text-align:left;font-size:13.5px}
.opt:last-child{border-bottom:0}
.opt .bx{width:14px;height:14px;border:1.2px solid var(--ink);border-radius:50%;position:relative}
.opt.sq .bx{border-radius:0}
.opt.on .bx::after{content:"";position:absolute;inset:2px;background:var(--ink);border-radius:inherit}
.opt .k{font-size:9.5px;color:var(--mute)}
.opt:hover{background:var(--acc-soft)}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0}
.chk .bx{width:13px;height:13px;border:1.2px solid var(--ink);position:relative}
.chk.on .bx::after{content:"";position:absolute;inset:2px;background:var(--ink)}
.minisw{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.minisw button{width:22px;height:22px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);position:relative}
.minisw button.on::after{content:"";position:absolute;inset:3px;border:1.5px solid var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:4px 9px;border:1px solid var(--ink);background:#fff}
.chip.on{background:var(--ink);color:#fff}
.rng{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:11.5px;color:var(--mute)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:
  repeating-linear-gradient(to right,var(--ink) 0 1px,transparent 1px 10%) center/100% 7px no-repeat,
  linear-gradient(var(--ink),var(--ink)) center/100% 1px no-repeat}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:18px;background:var(--acc);border:1px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:10px;height:18px;background:var(--acc);border:1px solid var(--ink);border-radius:0}
.navbar{display:grid;grid-template-columns:1fr 1.4fr;border-top:1px solid var(--ink);position:sticky;bottom:0;background:var(--card)}
.navbar button{min-width:0;padding:16px 14px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.navbar button .k{font-size:9.5px;color:inherit;opacity:.7}
.navbar .back{border-right:1px solid var(--ink)}
.navbar .back:hover{background:#fff}
.navbar .next{background:var(--ink);color:#fff}
.navbar .next:hover{background:#000}
.navbar button:disabled{opacity:.35;cursor:default}
.exportbox{width:100%;height:110px;font-family:var(--mono);font-size:10.5px;border:1px solid var(--ink);padding:8px;background:#fff;resize:vertical}

/* intro */
.intro{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(201,202,199,.55);backdrop-filter:blur(3px);padding:16px;overflow:auto}
.form{width:min(560px,100%);background:#FBFBF9;border:1px solid var(--ink);box-shadow:10px 10px 0 rgba(20,20,20,.08)}
.form .fh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-bottom:1px solid var(--ink)}
.form .fh b{font-family:var(--px);font-weight:400;font-size:16px}
.form .lead{padding:16px;border-bottom:1px solid var(--ink)}
.form .lead h1{font-size:21px;font-weight:500;margin-bottom:6px;text-wrap:balance}
.dur{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dur input{width:90px}
.dur span{font-family:var(--tw);font-size:15px}
.form .navbar{position:static}

/* step 4 cards */
.cards{position:absolute;top:0;bottom:0;left:260px;right:352px;z-index:5;overflow:auto;background:var(--paper);padding:70px 28px 40px;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:22px;align-content:start}
.cards{display:grid}
.cards[hidden],.viewtog[hidden],.zoom[hidden]{display:none}
.acard{background:#FAFAF7;border:1px solid #b9b9b3;box-shadow:0 1px 0 #d6d6d0,0 8px 22px rgba(0,0,0,.06);position:relative;font-size:13px}
.acard .h{display:grid;grid-template-columns:1fr 150px;border-bottom:1px solid var(--ink)}
.acard .h>div{padding:10px 12px;display:flex;align-items:baseline;gap:12px}
.acard .h>div+div{border-left:1px solid var(--ink)}
.acard .h .tw{font-size:19px;letter-spacing:.18em}
.acard .b{display:grid;grid-template-columns:1fr 150px}
.acard .fl>div{display:grid;grid-template-columns:70px minmax(0,1fr);border-bottom:1px solid var(--rule2);padding:7px 12px;gap:8px}
.acard .fl>div:last-child{border-bottom:0}
.acard .fl .k{font-size:9.5px;padding-top:3px}
.acard .fl .tw{font-size:14px;line-height:1.55;word-break:break-word}
.acard .img{border-left:1px solid var(--ink);padding:10px;display:flex;flex-direction:column;gap:6px}
.acard .img svg{width:100%;height:auto;aspect-ratio:1/1;display:block;border:1px solid var(--rule2)}
.acard .img .tw{text-align:right;font-size:15px}
.stamp{position:absolute;right:16px;bottom:30px;transform:rotate(-7deg);border:2px solid var(--acc);color:var(--acc);padding:3px 10px;font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:.12em;background:rgba(250,250,247,.6)}
.stamp small{display:block;font-size:8.5px;letter-spacing:.14em}
.rank{list-style:none;display:flex;flex-direction:column;border-top:1px solid rgba(20,20,20,.55)}
.rk{display:grid;grid-template-columns:30px 44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule2);background:transparent;cursor:grab}
.rk:first-child{border-top:0}
.rk.dragging{opacity:.4}.rk.over{box-shadow:inset 0 2px 0 var(--acc)}
.rk .rn{font-family:var(--mono);font-size:18px;font-weight:300}
.rk .th svg{width:44px;height:44px;display:block}
.rk .nm{font-size:13.5px;overflow:hidden}.rk .nm small{display:block;color:var(--mute);font-size:11.5px}
.rk .mv{display:flex;gap:2px}.rk .mv button{width:26px;height:26px;border:1px solid var(--ink);font-family:var(--mono);font-size:12px;background:#fff}
.rk .mv button:disabled{opacity:.25}
.rk:first-child .rn{color:var(--acc)}
.plan{grid-column:1/-1;background:#FAFAF7;border:1px solid var(--ink);display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.plan>div{padding:12px 14px;border-right:1px solid var(--ink);min-width:0}
.plan>div:last-child{border-right:0}
.plan .ph{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--ink);display:flex;gap:12px;align-items:baseline}
.plan .ph b{font-weight:500;font-size:15px}
.plan .pi{font-family:var(--tw);font-size:13.5px;line-height:1.55;padding:8px 0;border-bottom:1px solid var(--rule2)}
.plan .pi:last-child{border-bottom:0}
.plan .pi b{font-weight:400;text-decoration:underline;text-decoration-color:var(--acc);text-underline-offset:3px}
.plan .pi small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--mute);margin-top:2px}
.plan .pi .no{font-family:var(--mono);font-size:10px;color:var(--mute)}
.plan .pi .must{font-family:var(--mono);font-size:9.5px;border:1px solid var(--acc);color:var(--acc);padding:0 4px}
.plan .pi.empty{color:var(--mute)}
.homecard{grid-column:1/-1;background:#FAFAF7;border:1px solid var(--ink);display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.homecard>div{padding:12px 14px;border-right:1px solid var(--ink)}
.homecard>div:last-child{border-right:0}
.homecard .val{font-family:var(--tw);font-size:17px;margin-top:6px}
.homecard .pxv{font-family:var(--px);font-size:30px;color:var(--acc);margin-top:4px}
.homecard .sent{grid-column:1/-1;border-top:1px solid var(--ink);border-right:0;font-family:var(--tw);font-size:20px;line-height:1.5}

@media (max-width:980px){
  body{overflow:auto}
  .bar{grid-template-columns:1fr;height:auto}
  .brand{border-right:0;border-bottom:1px solid var(--ink);padding:10px 16px}
  .inv{display:none}
  .stp{padding:12px 14px}
  .wrap{height:auto;display:flex;flex-direction:column}
  .center{position:relative;height:62vh;order:1}
  .left,.right{position:static;width:auto;border-left:0;border-right:0}
  .left{order:0}.right{order:2}
  .zoom{left:16px}.viewtog{left:50%}
  .cards{left:0;right:0;grid-template-columns:1fr;padding:64px 16px 24px}
  .homecard,.rank{list-style:none;display:flex;flex-direction:column;border-top:1px solid rgba(20,20,20,.55)}
.rk{display:grid;grid-template-columns:30px 44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule2);background:transparent;cursor:grab}
.rk:first-child{border-top:0}
.rk.dragging{opacity:.4}.rk.over{box-shadow:inset 0 2px 0 var(--acc)}
.rk .rn{font-family:var(--mono);font-size:18px;font-weight:300}
.rk .th svg{width:44px;height:44px;display:block}
.rk .nm{font-size:13.5px;overflow:hidden}.rk .nm small{display:block;color:var(--mute);font-size:11.5px}
.rk .mv{display:flex;gap:2px}.rk .mv button{width:26px;height:26px;border:1px solid var(--ink);font-family:var(--mono);font-size:12px;background:#fff}
.rk .mv button:disabled{opacity:.25}
.rk:first-child .rn{color:var(--acc)}
.plan{grid-template-columns:repeat(2,minmax(0,1fr))}
  .acard .h,.acard .b{grid-template-columns:1fr 110px}
  .stamp{right:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------------- thumbnails ---------------- */
function miniField(inner,wall,floor){
  return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#F7F6F3"/>${wall?`<rect x="18" y="0" width="64" height="62" fill="${wall}"/><rect x="18" y="0" width="64" height="62" fill="url(#thWall)"/>`:''}<polygon points="18,62 82,62 100,80 0,80" fill="${floor||'#ECE8E1'}"/><rect y="80" width="100" height="20" fill="${floor?shade(floor,-.18):'#CFCAC1'}"/>${inner}</svg>`;
}
document.getElementById('sdefs').insertAdjacentHTML('beforeend','<linearGradient id="thWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F6F3" stop-opacity="1"/><stop offset=".6" stop-color="#0B0B0C" stop-opacity="0"/></linearGradient>');
(function(){const ns='http://www.w3.org/2000/svg';const sv=document.createElementNS(ns,'svg');sv.setAttribute('viewBox','0 0 283.46 283.46');sv.setAttribute('style','position:absolute;left:-9999px;top:0;width:283px;height:283px');document.body.appendChild(sv);
  OBJECTS.forEach(o=>{const g=document.createElementNS(ns,'g');g.innerHTML=o.flat;sv.appendChild(g);try{const b=g.getBBox();o.bb={x:b.x,y:b.y,w:b.width,h:b.height}}catch(e){o.bb={x:0,y:0,w:VB,h:VB}}});sv.remove()})();
function objThumb(o,color,m,bg='#EEEDEA'){
  const bb=o.bb||{x:0,y:0,w:VB,h:VB};const side=300;const cx=bb.x+bb.w/2,cy=VB/2+4;const x=cx-side/2,y=cy-side/2;
  let inner;
  inner=`<g fill-rule="evenodd" stroke="#211815" stroke-width="3.5" stroke-linejoin="round">${paint(o.raw,color||(m?mat(m).base:'#FFFFFF'))}</g>`;
  return `<svg viewBox="${x} ${y} ${side} ${side}"><rect x="${x}" y="${y}" width="${side}" height="${side}" fill="${bg}"/>${inner}</svg>`;
}
function ceilThumb(c){return miniField(`<polygon points="0,0 100,0 82,12 18,12" fill="${c}"/>`)}
function wallThumb(sd,c){
  if(sd==='back')return miniField('',c);
  const pts=sd==='left'?'0,0 18,0 18,62 0,80':'82,0 100,0 100,80 82,62';
  return miniField(`<polygon points="${pts}" fill="${shade(c,-.14)}"/><polygon points="${pts}" fill="url(#thWall)"/>`);
}
function thumb(it){
  if(it.kind==='object')return objThumb(objById(it.ref),it.color,it.material);
  if(it.kind==='wall'&&(it.side||'back')!=='back')return wallThumb(it.side,surfColor(it,'#F9F8F6'));
  if(it.kind==='wall'){if(it.material)return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#F7F6F3"/>${matSurface(it.material,18,0,64,62,it.color)}<rect x="18" y="0" width="64" height="62" fill="url(#thWall)"/><polygon points="18,62 82,62 100,80 0,80" fill="#ECE8E1"/><rect y="80" width="100" height="20" fill="#CFCAC1"/></svg>`;return miniField('',surfColor(it,'#F9F8F6'))}
  if(it.kind==='ceiling')return ceilThumb(surfColor(it,'#EBEAE6'));
  if(it.kind==='floor'){if(it.material)return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#F7F6F3"/><clipPath id="tf-${it.id}"><polygon points="18,62 82,62 100,80 0,80"/></clipPath><g clip-path="url(#tf-${it.id})">${matSurface(it.material,0,62,100,18,it.color)}</g><rect y="80" width="100" height="20" fill="${shade(surfColor(it,'#F3F1EC'),-.45)}"/></svg>`;return miniField('',null,surfColor(it,'#F3F1EC'))}
  if(it.kind==='color')return miniField(`<rect x="34" y="16" width="32" height="40" fill="#FAFAF7"/><rect x="36.5" y="18.5" width="27" height="29" fill="${it.color}"/>`);
  if(it.kind==='material')return `<svg viewBox="0 0 100 100">${matSurface(it.material,0,0,100,100,it.color)}</svg>`;
  if(it.kind==='light'){const c=lightColor(it.warmth);return miniField(it.type==='spot'?`<polygon points="47,14 53,14 70,70 30,70" fill="${c}" opacity=".35"/><ellipse cx="50" cy="70" rx="20" ry="6" fill="${c}" opacity=".8"/><circle cx="50" cy="14" r="6" fill="#fff"/>`:`<circle cx="50" cy="38" r="${26+18*(it.spread??.5)}" fill="${c}" opacity="${.3+it.strength*.4}" filter="url(#soft)"/><circle cx="50" cy="38" r="8" fill="#fff"/><circle cx="50" cy="38" r="13" fill="${c}" opacity=".6" filter="url(#soft)"/>`)}
  if(it.kind==='zone')return miniField(`<rect x="20" y="22" width="60" height="56" fill="${it.color||'#fff'}" fill-opacity="${it.color?.35:.06}" stroke="#3A3834" stroke-dasharray="4 3"/>`);
  return '';
}
function shortName(it){
  if(it.kind==='object')return objById(it.ref).name;
  if(it.kind==='color')return '色卡';
  if(it.kind==='material')return mat(it.material).name;
  if(it.kind==='light')return it.type==='spot'?'聚光燈':'散光';
  if(it.kind==='wall')return SIDE[it.side||'back'][0];
  if(it.kind==='floor')return '地板';
  if(it.kind==='ceiling')return '天花板';
  return it.label?`範圍 · ${it.label}`:'範圍';
}
function fullName(it){
  let n=shortName(it);
  if(it.kind==='color')n+=' '+it.color.toUpperCase();
  if(it.kind==='light')n+=' · '+(it.warmth>.62?'暖':it.warmth<.38?'冷':'自然')+'光';
  if(['object','zone','wall','floor','ceiling'].includes(it.kind)){const ex=[];if(it.color)ex.push(it.color.toUpperCase());if(it.material)ex.push(mat(it.material).name);if(ex.length)n+=' · '+ex.join(' · ')}
  return n;
}

/* ---------------- header ---------------- */
function renderTop(){
  $('steps').innerHTML=STEPS.map(([n,t],i)=>`<div class="stp ${i===S.step?'on':i<S.step?'done':''}"><span class="n">${n}</span>${t}</div>`).join('');
  $('inv').textContent=`INV. ${S.started?S.started.slice(0,10).replace(/-/g,'.'):'—'}  ·  ${String(S.items.length).padStart(2,'0')} ITEMS`;
}

/* ---------------- left ---------------- */
function indexList(withDel){
  return `<div class="idx">${S.items.map((it,i)=>{
    let st='';
    if(S.step===2){const a=it.answers;st=(a.reason||a.memory||a.scene||a.presence)?'<span class="st ok">● 已說</span>':'<span class="st">○</span>'}
    else if(S.step===3&&S.rank){const k=S.rank.indexOf(it.id);st=`<span class="st ok">#${k+1}</span>`}
    else if(S.step>=4){const d=WANT.find(x=>x[0]===it.want);st=d?`<span class="st ok">${d[1]}</span>`:'<span class="st">○</span>'}
    return `<div class="ir ${ui.sel===it.id?'on':''}" data-i="${i}" role="button" tabindex="0"><span class="no">${nr(it)}</span><span class="th">${thumb(it)}</span><span class="nm">${esc(fullName(it))}</span>${withDel?`<button class="del" data-del="${it.id}" aria-label="刪除">✕</button>`:st}</div>`}).join('')}</div>`;
}
function renderLeft(){
  const L=$('left');
  if(S.step===0){L.innerHTML=`<div class="sec"><div class="k">ABOUT<small>關於這份檔案</small></div><p class="note" style="margin-top:10px">你會為一個家建立一份檔案：先放入能代表它的符號，再說說每個符號，最後想想它們和下一個家的關係。</p></div>
    <div class="sec"><div class="k">INDEX<small>索引</small></div><p class="note" style="margin-top:8px;color:var(--mute)">尚未入檔。</p></div>`;return}
  if(S.step===1){
    const sel=find(ui.sel);const selCan=sel&&(ui.tab==='color'||ui.tab==='material');
    let h=`<div class="tabs" role="tablist">${KIND.map(([k,n,e])=>`<button class="tab ${ui.tab===k?'on':''}" data-tab="${k}" role="tab"><span>${n}</span><span class="k">${e}</span></button>`).join('')}</div><div class="sec">`;
    const canC=sel&&['object','zone','material','color','wall','floor','ceiling'].includes(sel.kind),canM=sel&&['object','zone','material','wall','floor','ceiling'].includes(sel.kind);
    const target=(on,verb)=>on?`<div class="selnote"><span>${verb} <b>No.${nr(sel)} ${esc(shortName(sel))}</b></span><button data-unsel>改成新增</button></div>`:'';
    if(ui.tab==='color'){
      h+=`<p class="note">選一個代表這個家的顏色。</p>${canC?target(true,'點顏色會替'):'<p class="hint2">點一下會放入一張色卡；先選取畫面上的符號，可以替它上色。</p>'}
      <div class="pal">${PALETTE.map((c,i)=>`<button class="pc ${canC&&sel.color===c?'on':''}" data-color="${c}" aria-label="${PALNAMES[i]}"><span class="swc" style="background:${c}"></span><span class="code">${PALNAMES[i]}</span></button>`).join('')}</div>
      <div class="custom-row"><label aria-label="自訂顏色"><input type="color" id="customColor" value="#9DBFD9"></label><span>自訂顏色<span class="k" style="display:block;color:var(--mute);font-size:9px;margin-top:2px">CUSTOM</span></span></div>`;
    }
    if(ui.tab==='material'){
      h+=`<p class="note">選一種代表這個家的質地。</p>${canM?target(true,'點材質會套用到'):'<p class="hint2">點一下會放入一塊材質樣本；先選取畫面上的符號，可以替它換材質。</p>'}
      <div class="mlist">${MATS.map((m,i)=>`<button class="mrow" data-mat="${m.id}"><svg viewBox="0 0 52 52">${matSurface(m.id,0,0,52,52)}</svg><span class="nm">${m.name}<small>${m.en}</small></span><span class="code">M-${String(i+1).padStart(2,'0')}</span></button>`).join('')}</div>`;
    }
    if(ui.tab==='light')h+=`<p class="note">放一道光，之後可以調整冷暖、強弱和光的範圍。</p>
      <div class="mlist">${[['glow','散光','GLOW'],['spot','聚光燈','SPOTLIGHT']].map(([t,n,e])=>`<button class="mrow" data-light="${t}">${miniField(t==='spot'?`<polygon points="47,14 53,14 70,70 30,70" fill="#FFE2B8" opacity=".35"/><ellipse cx="50" cy="70" rx="20" ry="6" fill="#FFE2B8" opacity=".8"/><circle cx="50" cy="14" r="6" fill="#fff"/>`:`<circle cx="50" cy="38" r="30" fill="#FFE2B8" opacity=".55" filter="url(#soft)"/><circle cx="50" cy="38" r="8" fill="#fff"/>`)}<span class="nm">${n}<small>${e}</small></span><span class="code">+</span></button>`).join('')}</div>`;
    if(ui.tab==='zone')h+=`<p class="note">需要的話，可以加入牆面或地板，或圈出一個範圍。</p>
      <div class="mlist">${[['wall:back','後牆','BACK WALL'],['wall:left','左牆','LEFT WALL'],['wall:right','右牆','RIGHT WALL'],['ceiling','天花板','CEILING'],['floor','地板','FLOOR'],['zone','範圍','ZONE']].map(([k,n,e])=>{const [kk,sd]=k.split(':');const ex=kk==='wall'?wallOf(sd):(kk==='floor'||kk==='ceiling')&&surf(kk);return `<button class="mrow" data-add="${k}">${kk==='ceiling'?ceilThumb('#EBEAE6'):kk==='wall'?wallThumb(sd,'#F9F8F6'):kk==='floor'?miniField('',null,'#D9D2C6'):miniField('<rect x="20" y="22" width="60" height="56" fill="none" stroke="#3A3834" stroke-dasharray="4 3"/>')}<span class="nm">${n}<small>${e}</small></span>${ex?'<span class="tag">已加入</span>':'<span class="code">+</span>'}</button>`}).join('')}</div>`;
    if(ui.tab==='object')h+=`<p class="note">選一件代表這個家的物品。</p>${OBJ_CATS.map(c=>`<div class="ocat"><div class="k">${c.en}<small>${c.name}</small></div><div class="cells c3">${OBJECTS.filter(o=>o.cat===c.id).map(o=>`<button class="cell" data-obj="${o.id}" title="${o.name}">${objThumb(o)}<span class="cap"><span style="white-space:nowrap">${o.name}</span></span></button>`).join('')}</div></div>`).join('')}`;
    h+=`</div><div class="sec"><div class="k">INDEX · ${String(S.items.length).padStart(2,'0')}<small>已放入的符號</small></div>${S.items.length?indexList(true):'<p class="note" style="margin-top:8px;color:var(--mute)">還沒有放入任何符號。</p>'}</div>`;
    L.innerHTML=h;
    L.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;log('tab',{tab:ui.tab});renderLeft()});
    L.querySelectorAll('[data-obj],[data-mat],[data-color],[data-light],[data-add]').forEach(b=>{let t;b.onmouseenter=()=>{t=setTimeout(()=>log('peek',{what:b.dataset.obj||b.dataset.mat||b.dataset.color||b.dataset.light||b.dataset.add}),800)};b.onmouseleave=()=>clearTimeout(t)});
    L.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{ui.colorMode=b.dataset.cm;renderLeft()});
    L.querySelectorAll('[data-mm]').forEach(b=>b.onclick=()=>{ui.matMode=b.dataset.mm;renderLeft()});
    L.querySelectorAll('[data-unsel]').forEach(b=>b.onclick=()=>{ui.sel=null;renderAll()});
    L.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>applyColor(b.dataset.color));
    const cc=L.querySelector('#customColor');if(cc)cc.onchange=()=>applyColor(cc.value);
    L.querySelectorAll('[data-mat]').forEach(b=>b.onclick=()=>applyMat(b.dataset.mat));
    L.querySelectorAll('[data-obj]').forEach(b=>b.onclick=()=>addItem('object',{ref:b.dataset.obj}));
    L.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const [k,sd]=b.dataset.add.split(':');addItem(k,sd?{side:sd}:{})});
    L.querySelectorAll('[data-light]').forEach(b=>b.onclick=()=>addItem('light',{type:b.dataset.light}));
    L.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();removeItem(b.dataset.del)});
    L.querySelectorAll('.ir').forEach(el=>el.onclick=()=>{const it=S.items[+el.dataset.i];ui.sel=it.id;if(bbox(it))focusItem(it);renderAll()});
    return;
  }
  L.innerHTML=`<div class="sec"><div class="k">INDEX · ${String(S.items.length).padStart(2,'0')}<small>${S.step===2?'逐一說說每個符號':S.step===4?'逐一決定每個符號':S.step===3?'在右邊排序':'點選可回去修改'}</small></div>${indexList(false)}</div>`;
  L.querySelectorAll('.ir').forEach(el=>el.onclick=()=>{ui.qi=+el.dataset.i;ui.sel=S.items[ui.qi].id;
    if(S.step===5){const c=document.querySelector(`[data-card="${ui.sel}"]`);if(c&&ui.view==='cards')c.scrollIntoView({behavior:'smooth',block:'center'});renderLeft();return}
    renderAll()});
}

/* ---------------- right ---------------- */
function head(n,title,sub){return `<div class="rh"><div class="rhl"><span class="k">${sub}</span><span class="big">${String(n).padStart(2,'0')}<small>/05</small></span></div><h2>${title}</h2></div>`}
function nav(backLabel,nextLabel,nextEn,dis){return `<div class="navbar"><button class="back" id="back"><span>← ${backLabel}</span><span class="k">BACK</span></button><button class="next" id="next" ${dis?'disabled':''}><span>${nextLabel} →</span><span class="k">${nextEn}</span></button></div>`}
function recTop(it,extra=''){
  return `<div class="top"><div class="meta">
      <div class="r"><div class="k">INV. NR<small>編號</small></div><div class="v tw" style="font-size:17px;letter-spacing:.14em">${nr(it)}</div></div>
      <div class="r"><div class="k">TYPE<small>類別</small></div><div class="v">${KN[it.kind]} <span class="k" style="color:var(--mute)">${KE[it.kind]}</span></div></div>
      <div class="r"><div class="k">ITEM<small>名稱</small></div><div class="v">${esc(fullName(it))}${it.memo?`<span class="tw" style="color:#4a4a46">— ${esc(it.memo)}</span>`:''}</div></div>${extra}
    </div><div class="typ"><div class="k"><span>TYP</span><span>1/1</span></div>${thumb(it)}</div></div>`;
}
function inspector(it){
  if(!it)return `<div class="rec"><div class="r"><div class="k">RECORD<small>紀錄</small></div><div class="v" style="color:var(--mute);font-size:12.5px">點選畫面上的符號，可以在這裡調整大小、顏色、材質或寫備忘。</div></div></div>`;
  let r='';
  if(it.kind==='light')r+=`<div class="r"><div class="k">TYPE<small>光的種類</small></div><div class="v"><div class="chips">${[['glow','散光'],['spot','聚光燈']].map(([t,n])=>`<button class="chip ${(it.type||'glow')===t?'on':''}" data-lt="${t}">${n}</button>`).join('')}</div></div></div><div class="r"><div class="k">POSITION<small>光的位置</small></div><div class="v"><div class="chips">${[['front','前方照過來'],['back','從後面照（背光）']].map(([t,n])=>`<button class="chip ${(it.depth||'front')===t?'on':''}" data-ld="${t}">${n}</button>`).join('')}</div></div></div><div class="r"><div class="k">WARMTH<small>冷暖</small></div><div class="v"><div class="rng"><span>冷</span><input type="range" min="0" max="1" step=".01" value="${it.warmth}" data-p="warmth" aria-label="冷暖"><span>暖</span></div></div></div>
     <div class="r"><div class="k">INTENSITY<small>強弱</small></div><div class="v"><div class="rng"><span>弱</span><input type="range" min="0" max="1" step=".01" value="${it.strength}" data-p="strength" aria-label="強弱"><span>強</span></div></div></div>
     ${it.type==='spot'?`<div class="r"><div class="k">ANGLE<small>照射角度</small></div><div class="v"><div class="rng"><span>↙</span><input type="range" min="-60" max="60" step="1" value="${it.angle||0}" data-p="angle" aria-label="照射角度"><span>↘</span></div></div></div>`:''}<div class="r"><div class="k">SPREAD<small>集中／散開</small></div><div class="v"><div class="rng"><span>集中</span><input type="range" min="0" max="1" step=".01" value="${it.spread??.5}" data-p="spread" aria-label="集中或散開"><span>散開</span></div></div></div>
     <div class="r"><div class="k">REACH<small>範圍</small></div><div class="v" style="font-size:12.5px">${lightZone(it)?`只照亮 No.${nr(lightZone(it))} ${esc(shortName(lightZone(it)))}`:'照亮整個場景'}</div></div>`;
  if(it.kind==='object')r+=`<div class="r"><div class="k">ROTATE<small>旋轉</small></div><div class="v"><div class="rng"><span>↺</span><input type="range" min="-180" max="180" step="1" value="${it.rot||0}" data-p="rot" aria-label="旋轉"><span>↻</span></div><div class="chips"><button class="chip ${it.flip?'on':''}" data-flip>左右翻轉</button><button class="chip" data-rot0>轉正</button></div></div></div>`;
  if(['object','color','material'].includes(it.kind)&&bbox(it))r+=`<div class="r"><div class="k">SCALE<small>大小</small></div><div class="v"><div class="rng"><span>小</span><input type="range" min="${it.kind==='object'?120:80}" max="${it.kind==='object'?760:420}" step="1" value="${it.size}" data-p="size" aria-label="大小"><span>大</span></div></div></div>`;
  if(['object','zone','material','wall','floor','ceiling'].includes(it.kind))r+=`<div class="r"><div class="k">COLOUR<small>顏色</small></div><div class="v"><div class="minisw">${PALETTE.map(c=>`<button style="background:${c}" class="${it.color===c?'on':''}" data-c="${c}" aria-label="${c}"></button>`).join('')}<button data-c="" aria-label="清除" style="background:repeating-linear-gradient(45deg,#fff 0 3px,#ddd 3px 5px)"></button></div></div></div>`;
  if(['object','zone','wall','floor','ceiling'].includes(it.kind))r+=`<div class="r"><div class="k">MATERIAL<small>材質</small></div><div class="v"><div class="chips">${MATS.map(m=>`<button class="chip ${it.material===m.id?'on':''}" data-m="${m.id}">${m.name}</button>`).join('')}<button class="chip" data-m="">無</button></div></div></div>`;
  if(it.color)r+=`<div class="r"><div class="k">TONE<small>明暗／鮮豔</small></div><div class="v">
      <div class="rng"><span>暗</span><input type="range" min="0" max="1" step=".01" value="${hexToHsl(it.color)[2].toFixed(2)}" data-hsl="2" aria-label="明暗"><span>亮</span></div>
      <div class="rng"><span>灰</span><input type="range" min="0" max="1" step=".01" value="${hexToHsl(it.color)[1].toFixed(2)}" data-hsl="1" aria-label="鮮豔度"><span>艷</span></div>
      <div class="mono" style="font-size:10.5px;color:var(--mute)" id="hexout">${it.color.toUpperCase()}</div></div></div>`;
  if(it.kind==='zone')r+=`<div class="r"><div class="k">LABEL<small>空間名字</small></div><div class="v"><input class="line" id="f-label" value="${esc(it.label)}" data-p="label" placeholder="可不寫，例如：吃飯的地方"></div></div>`;
  r+=`<div class="r"><div class="k">MEMO<small>備忘</small></div><div class="v"><input class="line" id="f-memo" value="${esc(it.memo)}" data-p="memo" placeholder="可不寫，幾個字就好"></div></div>
      <div class="r"><div class="k">REMOVE<small>刪除</small></div><div class="v"><button class="chip" data-delit style="align-self:flex-start">刪除這個符號</button></div></div>`;
  return `<div class="rec">${recTop(it)}${r}</div>`;
}
function bindInspector(R,it){
  if(!it)return;
  R.querySelectorAll('[data-p]').forEach(el=>{const p=el.dataset.p;
    el.oninput=()=>{it[p]=el.type==='range'?+el.value:el.value;scheduleStage();save()};
    el.onchange=()=>{log('edit',{id:it.id,prop:p,value:it[p]});renderTop();if(el.type==='range')renderLeft()}});
  R.querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>{it.color=el.dataset.c||null;log('apply_color',{id:it.id,color:it.color});renderAll()});

    const rows=[];S.items.forEach(it=>{if(!it.want||it.want==='no')return;it.ways.filter(w=>WAYS.find(x=>x[0]===w)[3]===ph).forEach(w=>rows.push(`<div class="pi"><span class="no">No.${nr(it)}</span> ${esc(shortName(it))}<br><b>${WAYS.find(x=>x[0]===w)[1]}</b>${it.want==='must'?' <span class="must">必要</span>':''}${ph==='ongoing'&&it.how?`<small>${esc(it.how)}</small>`:''}${it.essence.length?`<small>要保留：${it.essence.map(k=>ESSENCE.find(c=>c[0]===k)[1]).join('、')}</small>`:''}</div>`))});
    return `<div><div class="k">${e}<small>${t}</small></div>${rows.join('')||'<div class="pi empty">—</div>'}</div>`}).join('');
  const let_=S.items.filter(it=>it.want==='no').map(it=>`<div class="pi"><span class="no">No.${nr(it)}</span> ${esc(shortName(it))}${it.letgo?`<small>${esc(it.letgo)}</small>`:''}</div>`).join('')||'<div class="pi empty">—</div>';
  return `<section class="plan"><div class="ph"><span class="k">PLAN</span><b>下一個家的準備清單</b></div>${cols}<div><div class="k">LET GO<small>可以放下的</small></div>${let_}</div></section>`;
}

/* ---------------- flow ---------------- */
function go(n){S.step=n;if((n===2||n===4)&&S.items[ui.qi])log('item_enter',{id:S.items[ui.qi].id,step:n});if(n===1)ui.sel=null;if(n===2||n===4){const it=S.items[ui.qi];ui.sel=it?it.id:null;if(it)focusItem(it)}if(n===3){ui.sel=null}if(n===5){ui.view='cards'}log('step',{to:n});renderAll()}
function renderAll(){renderTop();renderLeft();renderRight();renderIntro();renderCards();renderStage();$('zoom').hidden=S.step===0;save()}
function exportData(){return JSON.stringify({version:2,exported:new Date().toISOString(),view:{tx:V.tx,ty:V.ty,k:V.k},...S})}
let DB=null,UID=null;
(async()=>{try{if(!window.claude||!claude.use)return;const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;UID=await user.id();if(UID)DB=db}catch(e){}})();
/* GitHub 版本：把 Google Apps Script 部署後的網址貼在這裡 */
const SHEET_URL='';
async function submitToDB(){
  if(!S.runId)S.runId=new Date().toISOString().replace(/[:.]/g,'-')+'-'+uid();
  if(!DB||!UID){
    if(!SHEET_URL)return false;
    try{await fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({runId:S.runId,home:S.home.name||'',items:S.items.length,data:exportData()})});return true}catch(e){return false}
  }
  try{await DB.doc(`sessions/${UID}/runs/${S.runId}`).set({submitted:new Date().toISOString(),home:S.home.name||'',items:S.items.length,data:exportData()});return true}catch(e){return false}
}
async function finish(){
  if(!ui.exported){log('finish');ui.exported=true;
    const ok=await submitToDB();ui.saved=ok;renderRight();
    if(ok){toast('已送出，謝謝你');return}}
  const box=$('exportbox');if(!box)return;box.value=exportData();
  const done=()=>toast('已複製，謝謝你');const fail=()=>{box.focus();box.select();toast('已選取，請按 Ctrl／⌘ + C 複製')};
  try{navigator.clipboard.writeText(box.value).then(done,fail)}catch(e){fail()}
}
load();renderAll();
</script>
